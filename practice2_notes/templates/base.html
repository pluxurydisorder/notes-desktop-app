<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title|default('Заметки') }} — Notes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">N</span><span>Заметки</span></a>
      <nav><a href="{{ url_for('index') }}">Все заметки</a><a class="nav-cta" href="{{ url_for('create_note') }}">＋ Новая заметка</a></nav>
    </div>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Учебное приложение · Практическая работа № 2</footer>
</body>
</html>
